name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test --configuration Release --logger "console;verbosity=normal"

  mobile:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Optional: repository secrets ANDROID_KEYSTORE_BASE64 (the .jks, base64) and ANDROID_KEY_PROPERTIES
      # (the key.properties text). Without them the APK is signed with a debug key.
      - name: Release signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > android/watchparty-release.jks
          echo "$KEY_PROPERTIES" > android/key.properties
      - name: Build APK
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: watchparty-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
      - name: Build web (for the browser tests)
        run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: mobile/build/web

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: [backend, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: flutter-web
          path: mobile/build/web
      - name: Install ffmpeg and Playwright
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          cd e2e && npm install && npx playwright install --with-deps chromium
      - name: Start servers
        # Without ffprobe the WebM test videos are published as-is (Chromium in CI has no H.264).
        # "site" serves the website at /; "app" serves the Flutter web build at / and the website at /site.html.
        run: |
          dotnet build src/WatchParty.Api --configuration Release
          ./e2e/combine-webroot.sh "$RUNNER_TEMP/webroot"
          start() {
            local name=$1 port=$2; shift 2
            # The redirect covers the whole subshell, so nothing keeps this step's output open.
            (cd src/WatchParty.Api && exec env Auth__InviteCode=amigos123 Ffmpeg__FfprobePath=/nonexistent Backup__Enabled=false \
              ConnectionStrings__Default="Data Source=$RUNNER_TEMP/$name.db" Storage__RootPath="$RUNNER_TEMP/$name-media" \
              DataProtection__KeysPath="$RUNNER_TEMP/$name-keys" ASPNETCORE_URLS="http://localhost:$port" "$@" \
              dotnet bin/Release/net10.0/WatchParty.Api.dll) > "$RUNNER_TEMP/$name.log" 2>&1 < /dev/null &
          }
          start site 5090
          start app 5100 ASPNETCORE_WEBROOT="$RUNNER_TEMP/webroot"
          for port in 5090 5100; do
            for i in $(seq 1 60); do curl -sf "http://localhost:$port/health" > /dev/null && break; sleep 1; done
            curl -sf "http://localhost:$port/health" > /dev/null || { cat "$RUNNER_TEMP"/*.log; exit 1; }
          done
      - name: Website tests
        working-directory: e2e
        run: BASE_URL=http://localhost:5090 node run.mjs web-sync web-features
      - name: App + website test
        working-directory: e2e
        run: BASE_URL=http://localhost:5100 node run.mjs flutter-web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            e2e/screenshots
            ${{ runner.temp }}/*.log
